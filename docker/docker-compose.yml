services:
  order-db:
    image: postgres:16-alpine
    container_name: dealership-order-db
    environment:
      POSTGRES_DB: order_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5433:5432"
    volumes:
      - order_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d order_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  storage-db:
    image: postgres:16-alpine
    container_name: dealership-storage-db
    environment:
      POSTGRES_DB: storage_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5434:5432"
    volumes:
      - storage_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d storage_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    container_name: dealership-rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  keycloak:
    image: quay.io/keycloak/keycloak:26.1
    container_name: dealership-keycloak
    command: start-dev --import-realm
    environment:
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
      KC_HEALTH_ENABLED: "true"
    ports:
      - "8081:8080"
    volumes:
      - ./keycloak/realm-dealership.json:/opt/keycloak/data/import/realm-dealership.json:ro
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/127.0.0.1/9000 && printf \"GET /health/ready HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n\" >&3 && grep -q \"200\" <&3'"]
      interval: 10s
      timeout: 5s
      retries: 10

  order-service:
    build:
      context: ..
      dockerfile: docker/Dockerfile
      args:
        SERVICE: order-service
    container_name: dealership-order-service
    depends_on:
      order-db:
        condition: service_healthy
      storage-service:
        condition: service_started
      rabbitmq:
        condition: service_healthy
      keycloak:
        condition: service_healthy
    environment:
      ORDER_DB_URL: jdbc:postgresql://order-db:5432/order_db?sslmode=disable
      ORDER_DB_USERNAME: postgres
      ORDER_DB_PASSWORD: postgres
      RABBITMQ_HOST: rabbitmq
      KEYCLOAK_ISSUER_URI: http://keycloak:8080/realms/dealership
      STORAGE_GRPC_HOST: storage-service
      STORAGE_GRPC_PORT: 9090
      STORAGE_GRPC_TIMEOUT_MS: 5000
    ports:
      - "8080:8080"

  storage-service:
    build:
      context: ..
      dockerfile: docker/Dockerfile
      args:
        SERVICE: storage-service
    container_name: dealership-storage-service
    depends_on:
      storage-db:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      keycloak:
        condition: service_healthy
    environment:
      STORAGE_DB_URL: jdbc:postgresql://storage-db:5432/storage_db?sslmode=disable
      STORAGE_DB_USERNAME: postgres
      STORAGE_DB_PASSWORD: postgres
      RABBITMQ_HOST: rabbitmq
      KEYCLOAK_ISSUER_URI: http://keycloak:8080/realms/dealership
      DEFAULT_WAREHOUSE_EMPLOYEE_ID: 00000000-0000-0000-0000-000000000001
      STORAGE_GRPC_PORT: 9090
    ports:
      - "8082:8082"
      - "9090:9090"

volumes:
  order_db_data:
  storage_db_data: